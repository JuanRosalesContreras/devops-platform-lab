apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-platform-api
spec:
  replicas: 1

  selector:
    matchLabels:
      app: devops-platform-api

  template:
    metadata:
      labels:
        app: devops-platform-api

    spec:
      containers:
        - name: api
          image: ghcr.io/juanrosalescontreras/devops-platform-lab:sha-0ae00f1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          env:
            - name: APP_VERSION
              value: sha-0ae00f1

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
