apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-platform-api
spec:
  replicas: 2

  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: devops-platform-api
          matchLabelKeys:
            - pod-template-hash

      containers:
        - name: api
          env:
            - name: APP_ENV
              value: prod
