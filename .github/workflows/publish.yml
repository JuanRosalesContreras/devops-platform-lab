name: Publish Container Image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/juanrosalescontreras/devops-platform-lab

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Docker version
        run: docker version

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Build container image
        run: |
          docker build \
            -t "${IMAGE_NAME}:latest" \
            -t "${IMAGE_NAME}:sha-${GITHUB_SHA::7}" \
            .

      - name: Push container image
        run: |
          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:sha-${GITHUB_SHA::7}"

      - name: Log out from GHCR
        if: always()
        run: docker logout ghcr.io || true
