name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -W error -q

  docker-build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Docker version
        run: docker version

      - name: Validate Dockerfile
        run: docker build --check .

      - name: Build Docker image
        run: docker build -t devops-platform-lab:ci .

      - name: Run Docker container
        run: |
          docker run -d \
            --name devops-platform-api-ci \
            -p 8000:8000 \
            -e APP_ENV=ci \
            -e APP_VERSION=${{ github.sha }} \
            devops-platform-lab:ci

      - name: Wait for container health
        run: |
          for attempt in {1..12}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' devops-platform-api-ci)"
            echo "Attempt ${attempt}: health=${status}"

            if [ "${status}" = "healthy" ]; then
              exit 0
            fi

            if [ "${status}" = "unhealthy" ]; then
              docker logs devops-platform-api-ci
              exit 1
            fi

            sleep 5
          done

          echo "Container did not become healthy in time."
          docker logs devops-platform-api-ci
          exit 1

      - name: Validate health endpoint
        run: |
          response="$(curl --fail --silent http://127.0.0.1:8000/health)"
          echo "Response: ${response}"
          test "${response}" = '{"status":"healthy"}'

      - name: Show container logs
        if: always()
        run: docker logs devops-platform-api-ci || true

      - name: Remove Docker container
        if: always()
        run: docker rm -f devops-platform-api-ci || true
